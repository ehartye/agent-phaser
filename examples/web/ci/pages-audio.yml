name: Deploy to GitHub Pages
# Template: a web game on GitHub Pages whose audio is generated by agent-beeps, fetched in CI by hash and never rendered there.
# Copy to .github/workflows/pages.yml and change the values marked EDIT.
#
# Status: written from agent-beeps 0.6.0 docs/build-lock-and-store.md and its beeps-ship skill, and shaped after the Fallow Valley workflow.
# At the time of writing Fallow Valley's own audio job still ran the phase 0 form (check, then render only what changed); its switch to
# `fetch.mjs` had not landed on main. Where this file and a game disagree, trust agent-beeps' docs, then fix this file.
#
# Why this shape: see skills/engine-asset-import/references/ci-for-generated-assets.md (lock + store + fetch, never regenerate, cache traps) and
# audio-integration.md (what the app does with the files). Mechanism: agent-beeps docs/build-lock-and-store.md.
#
# One-time setup on the author's machine (never in CI):
#   beeps build                                   # renders only what is stale, writes public/audio and asset-src/audio/audio.lock.json
#   beeps build --push --store release:OWNER/STORE_REPO   # needs GITHUB_TOKEN with contents:write on the store repo, or `gh auth login`
#   beeps ci export tools/audio                   # vendors tools/audio/fetch.mjs (Node 20+, no dependencies); commit it with the lock
# Commit the lock in the same change as the recipe edit. Forgetting `--push` makes the audio job fail naming the missing assets.
#
# Jobs: `audio` (fetch from the store, verify against the lock), `test` (typecheck, unit tests), `build` (needs audio), `browsers`
# (advisory), `deploy` (needs test and build only).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # EDIT: paths used below. They must match beeps.build.json ("lock" and "out") and the fetch.mjs location.
  AUDIO_LOCK: asset-src/audio/audio.lock.json
  AUDIO_OUT: public/audio
jobs:
  audio:
    runs-on: ubuntu-latest
    # A fetch is about a minute cold. A generous limit only matters if someone points this job at a renderer by mistake.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # An accelerator only. GitHub evicts a cache entry after 7 idle days and caps the repository at 10 GB, so the store is the source and
      # this is a hot copy. KEY ON THE LOCK'S HASH, not on the recipe folder: an edit that changes no audio input keeps the key.
      - name: Restore the finished audio
        uses: actions/cache@v6
        with:
          path: ${{ env.AUDIO_OUT }}
          key: audio-${{ hashFiles(env.AUDIO_LOCK) }}
          restore-keys: audio-
      # Downloads the assets the lock names that are missing, checks every file's sha256 and size against the LOCK (a bad store entry cannot
      # pass), writes atomically and regenerates index.json. No beeps, Chromium or ffmpeg. Exit 1 names assets the store lacks ("the author
      # must run beeps build --push") or whose bytes differ from the lock. Quote step names: `name: Audio: fetch` (colon, space) is a YAML
      # mapping and the whole workflow then fails to load.
      - name: 'Fetch the audio from the store and verify it against the lock'
        run: node tools/audio/fetch.mjs
      # Optional, cheap, no rendering: fail when the recipes changed but the lock was not rebuilt and committed. Needs beeps (the
      # `agent-beeps` plugin, or a checkout pinned by commit) and trusts the lock's encoder fingerprint when ffmpeg is absent. Drop it if the
      # test job should not carry beeps.
      # - name: 'Lock is current for the recipes'
      #   run: node "$BEEPS_LAUNCHER" build --check
      - uses: actions/upload-artifact@v7
        with:
          name: audio
          path: ${{ env.AUDIO_OUT }}
          retention-days: 1
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # public/audio is absent here, so tests that read the built catalog skip; the build job runs them.
      - run: npx vitest run
  build:
    needs: audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: audio
          path: ${{ env.AUDIO_OUT }}
      # EDIT: your catalog test. Every catalog entry has its file, every cue the game fires exists, nothing else is hosted, the folder is
      # inside its size budget. REQUIRE_AUDIO makes the tests fail instead of skip when the folder is empty.
      - run: npx vitest run tests/audio
        env:
          REQUIRE_AUDIO: '1'
      # EDIT: --base is the repository name for a project page.
      - run: npx vite build --base=/REPO_NAME/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  # The hosted audio in real browsers: it plays and decodes in Chromium and Firefox (decoded frames equal the catalog's, delta 0). WebKit on
  # Linux has no Ogg Opus: the spec asserts the game's unsupported-audio notice there. ADVISORY: software WebGL on a shared runner (about 2x
  # slower than a dev machine) is flaky, so a failure shows in its job but does not fail the run, and `deploy` does not wait for it. Make it
  # blocking only after it has been green on GitHub for a while. The real-GPU suite stays a local, pre-merge step.
  browsers:
    needs: audio
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: audio
          path: ${{ env.AUDIO_OUT }}
      - run: npx playwright install --with-deps chromium firefox webkit
      # A headless runner has no GPU, no display and no sound card. Firefox needs a display and software GL to make a WebGL
      # context at all, and a PulseAudio null sink or its AudioContext stays suspended for ever. Chromium brings its own
      # SwiftShader (forcing Mesa makes it several times slower), so it runs without either. Specs must wait on page time,
      # not frame counts: software GL draws about one frame a second.
      - name: 'Sound card for Firefox (PulseAudio null sink)'
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
      # EDIT: your specs and project names. Decode and unsupported-notice specs do not boot the game, so they pass in any engine.
      - name: 'Hosted audio plays and decodes; WebKit shows the unsupported notice'
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 npx playwright test --project=firefox --project=webkit tests/browser/audio-decode.spec.ts tests/browser/audio-unsupported.spec.ts
          npx playwright test --project=chromium tests/browser/audio-decode.spec.ts tests/browser/audio-unsupported.spec.ts
  deploy:
    needs: [test, build]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
